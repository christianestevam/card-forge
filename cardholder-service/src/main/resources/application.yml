spring:
  application:
    name: cardholder-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration,classpath:db/platform
  cloud:
    aws:
      region:
        static: ${AWS_REGION:us-east-1}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI}
          jwk-set-uri: ${JWT_JWK_SET_URI}
          audiences: cardholder-service
      client:
        registration:
          cardforge:
            provider: keycloak
            client-id: ${OAUTH_CLIENT_ID}
            client-secret: ${OAUTH_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            scope: products:read,cards:read
        provider:
          keycloak:
            token-uri: ${OAUTH_TOKEN_URI}

cardforge:
  outbox:
    enabled: true
  http:
    # Orçamento curto e sem retentativa para o catálogo e o card-service.
    connect-timeout: 500ms
    read-timeout: 1s
  catalog:
    base-url: ${CATALOG_BASE_URL}
  cards:
    base-url: ${CARDS_BASE_URL}
  issuance:
    requested-queue: card-issuance-requested
    completed-queue: card-issuance-completed
    completed-dead-letter-queue: card-issuance-completed-dlq
  openapi:
    token-url: http://localhost:8080/realms/cardforge/protocol/openid-connect/token

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  tracing:
    sampling:
      probability: 1.0
