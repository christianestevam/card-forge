server.port=${SERVER_PORT:8081}
spring.application.name=product-service
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/product?connectTimeout=3&socketTimeout=10}
spring.datasource.username=product
spring.datasource.password=${DATABASE_PASSWORD:product_local}
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.connection-init-sql=SET statement_timeout = '10s'
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/cardforge
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_URL:http://localhost:8080}/realms/cardforge/protocol/openid-connect/certs
spring.security.oauth2.resourceserver.jwt.audiences=product-service
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.tracing.propagation.type=w3c
management.tracing.sampling.probability=1.0
logging.structured.format.console=logstash
spring.jackson.default-property-inclusion=non_null
